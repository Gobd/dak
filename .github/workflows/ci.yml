name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  node:
    name: Node.js
    runs-on: ubuntu-latest
    # GITHUB_TOKEN lets the shellcheck npm package download its binary from
    # GitHub Releases without hitting the anonymous 60-req/hr rate limit.
    # Needed at both install time and first execution (it caches lazily).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check all apps
        run: pnpm check
