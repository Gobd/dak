esphome:
  name: esp32-outdoor
  friendly_name: 'Outdoor Sensor'
  min_version: 2024.6.0
  on_boot:
    priority: -10
    then:
      - switch.turn_on: stemma_power
      # Give the AHT20/LTR390/MAX17048 chain time to power up and complete at least one
      # update_interval cycle. PMSA003I additionally needs its fan spun up - see the
      # aqi_due check below for why we only pay that cost once an hour.
      - delay: 15s
      - lambda: |-
          // ~7 wakes per 8min sleep_duration ~= once per hour. Reset happens after publish.
          id(aqi_due) = id(wake_count) >= 7;
      - if:
          condition:
            lambda: 'return id(aqi_due);'
          then:
            # PMSA003I fan needs to run a bit before its reading stabilizes.
            - delay: 15s
      - mqtt.publish:
          topic: home-relay/sensors/esp32-outdoor
          payload: !lambda return id(outdoor_payload).state;
      - lambda: |-
          if (id(aqi_due)) {
            id(wake_count) = 0;
          } else {
            id(wake_count) += 1;
          }
      - delay: 1s
      - switch.turn_off: stemma_power
      - deep_sleep.enter: deep_sleep_1

globals:
  - id: wake_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: aqi_due
    type: bool
    restore_value: no
    initial_value: 'true'

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: arduino

# Loaded from secrets.yaml (see secrets.yaml.example) - never commit real credentials.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  # kiosk.home.arpa = the RPi5 running Mosquitto/Zigbee2MQTT/home-relay on the local LAN.
  # Must be reachable directly on the network - do not point this at a public reverse
  # proxy/tunnel hostname (e.g. zigbee2mqtt.bkemper.me), which serves the web UI over
  # HTTPS, not a raw MQTT port.
  broker: kiosk.home.arpa
  discovery: false

logger:
  level: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# STEMMA QT connector and onboard NeoPixel share GPIO2 as their power-enable pin.
# Keeping this switched off between wake cycles is most of the deep-sleep power savings -
# the AHT20/LTR390/PMSA003I/MAX17048 chain draws real current if left powered through sleep.
switch:
  - platform: gpio
    pin: GPIO2
    id: stemma_power
    restore_mode: ALWAYS_OFF

i2c:
  sda: GPIO22
  scl: GPIO20
  scan: false

i2c_device:
  id: max17048
  address: 0x36

# Board's own resistor-divider battery ADC (GPIO35/VOLTAGE_MONITOR), read alongside the
# MAX17048 as a redundant voltage cross-check (fuel gauge SOC%% estimates can drift over
# a battery's life; raw voltage is a simple sanity check against that drift).
sensor:
  - platform: adc
    pin: GPIO35
    id: vbat_raw
    attenuation: auto
    update_interval: 10s
    internal: true
    filters:
      # Board's divider halves VBAT before the ADC reads it - undo that here.
      - multiply: 2.0

  - platform: aht10
    variant: AHT20
    temperature:
      name: 'Outdoor Temperature'
      id: outdoor_temperature
    humidity:
      name: 'Outdoor Humidity'
      id: outdoor_humidity
    update_interval: 10s

  - platform: ltr390
    uv_index:
      name: 'Outdoor UV Index'
      id: outdoor_uv_index
    update_interval: 10s

  # Only actually sampled once/hour (see on_boot's aqi_due gate) - PMSA003I's fan is
  # noisy/wasteful to spin up every wake cycle. update_interval here just controls how
  # often the component itself refreshes while the STEMMA rail happens to be powered.
  - platform: pmsa003i
    pm_2_5:
      name: 'Outdoor PM2.5'
      id: outdoor_pm_2_5
    pm_10_0:
      name: 'Outdoor PM10'
      id: outdoor_pm_10_0
    update_interval: 60s

  # MAX17048 fuel gauge, read via the generic i2c_device component (declared above) rather
  # than ESPHome's built-in `max17043` platform - that driver's CONFIG-register identity
  # check (0x971C) targets the MAX17043 specifically and will mark_failed() against a
  # MAX17048. Same VCELL (0x02)/SOC (0x04) register addresses as the MAX17043, but
  # different conversion formulas - see Adafruit_MAX1704X.cpp: VCELL is 78.125uV/LSB
  # (16-bit, MSB first), SOC is raw/256.
  - platform: template
    name: 'Outdoor Battery Voltage'
    id: outdoor_battery_voltage
    unit_of_measurement: 'V'
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      uint16_t raw = 0;
      if (!id(max17048).read_byte_16(0x02, &raw)) return {};
      return raw * 78.125f / 1000000.0f;

  - platform: template
    name: 'Outdoor Battery Percent'
    id: outdoor_battery_percent
    unit_of_measurement: '%'
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      uint16_t raw = 0;
      if (!id(max17048).read_byte_16(0x04, &raw)) return {};
      return raw / 256.0f;

  # INA219 sits in series in the actual power line (BQ25185 LOAD -> INA219 VIN+/VIN- ->
  # Feather BAT), wired separately from its STEMMA QT I2C link in the sensor chain.
  # MAX17048 gives SOC%; this gives the numeric charge/discharge rate MAX17048's own
  # CRATE register is too noisy to provide (see BATTERY_WIDGET_PLAN.md history).
  # Positive current = charging (solar/BQ25185 delivering more than the board draws),
  # negative = discharging.
  - platform: ina219
    address: 0x40
    current:
      name: 'Outdoor Battery Current'
      id: outdoor_battery_current
      unit_of_measurement: 'mA'
      accuracy_decimals: 1
      filters:
        - multiply: 1000.0
    shunt_resistance: 0.1 ohm
    max_voltage: 5.0V
    max_current: 1.0A
    update_interval: 10s

text_sensor:
  # AQI fields (pm2_5/pm10) are omitted on wakes where aqi_due was false, rather than
  # publishing stale/zeroed PMSA003I readings that would overwrite home-relay's cached
  # hourly value. mqtt_service.py's on_message only sets fields present in the payload
  # via data.get(...), so omitting a key correctly leaves the last-known value in place.
  - platform: template
    name: 'Outdoor Sensor Payload'
    id: outdoor_payload
    internal: true
    lambda: |-
      char buf[380];
      if (id(aqi_due)) {
        snprintf(buf, sizeof(buf),
          "{\"temperature\":%.1f,\"humidity\":%.1f,\"uv_index\":%.1f,"
          "\"pm2_5\":%.1f,\"pm10\":%.1f,\"battery_pct\":%.1f,\"battery_voltage\":%.2f,"
          "\"battery_current_ma\":%.1f}",
          id(outdoor_temperature).state, id(outdoor_humidity).state,
          id(outdoor_uv_index).state, id(outdoor_pm_2_5).state, id(outdoor_pm_10_0).state,
          id(outdoor_battery_percent).state, id(outdoor_battery_voltage).state,
          id(outdoor_battery_current).state);
      } else {
        snprintf(buf, sizeof(buf),
          "{\"temperature\":%.1f,\"humidity\":%.1f,\"uv_index\":%.1f,"
          "\"battery_pct\":%.1f,\"battery_voltage\":%.2f,\"battery_current_ma\":%.1f}",
          id(outdoor_temperature).state, id(outdoor_humidity).state,
          id(outdoor_uv_index).state,
          id(outdoor_battery_percent).state, id(outdoor_battery_voltage).state,
          id(outdoor_battery_current).state);
      }
      return {std::string(buf)};

deep_sleep:
  id: deep_sleep_1
  # Safety net only - on_boot's explicit deep_sleep.enter (above) is the normal path.
  # This just guarantees the board still sleeps if publish/sensor reads ever hang.
  run_duration: 30s
  sleep_duration: 8min
