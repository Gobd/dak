# Home Assistant configuration - minimal seed for first install
# Full docs: https://www.home-assistant.io/docs/configuration/

default_config:

# Required for the Scripts/Scenes/Automations UI to save. Without these the
# components never load and the UI silently fails to write anything.
script: !include scripts.yaml
scene: !include scenes.yaml
automation: !include automations.yaml

# HTTP settings (use_x_forwarded_for, trusted_proxies for the OPNsense/Caddy
# reverse proxy) are configured via Settings -> System -> Network in the UI,
# not YAML - the http: YAML config is deprecated as of HA 2026.8 and stops
# working in 2027.2.

mqtt:
  broker: localhost

# Add MQTT via UI: Settings → Devices & Services → Add Integration → MQTT
# Point it at localhost:1883. Zigbee2MQTT devices auto-discover once
# zigbee2mqtt's homeassistant: true setting is on.
